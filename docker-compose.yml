# Cascade — one service, one switch.
#
#   Main server (default):   docker compose up -d
#   Storage node:            SERVER_MODE=node NODE_ACCESS_KEY=secret docker compose up -d
#
# Image comes from GHCR (built by .github/workflows/docker.yml).
# `docker compose up --build` builds from source instead.
services:
  cascade:
    image: ${CASCADE_IMAGE:-ghcr.io/nopethedev/cascade:latest}
    build: .
    pull_policy: missing
    ports:
      - "${CASCADE_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - SERVER_MODE=${SERVER_MODE:-main}
      - NODE_ACCESS_KEY=${NODE_ACCESS_KEY:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SITE_NAME=${SITE_NAME:-Cascade}
      - THEME_ACCENT=${THEME_ACCENT:-#e11d48}
      - FFMPEG_PATH=${FFMPEG_PATH:-/usr/bin/ffmpeg}
      - FFPROBE_PATH=${FFPROBE_PATH:-/usr/bin/ffprobe}
      - WHISPER_PROVIDER=${WHISPER_PROVIDER:-disabled}
      - WHISPER_ENDPOINT=${WHISPER_ENDPOINT:-}
      - WHISPER_MODEL_PATH=${WHISPER_MODEL_PATH:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WHISPER_API_KEY=${WHISPER_API_KEY:-}
    volumes:
      - cascade-data:/app/data
    restart: unless-stopped

volumes:
  cascade-data:
